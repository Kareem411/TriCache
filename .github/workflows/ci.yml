name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  validate:
    name: Lint & Typecheck (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint static analysis
        run: pnpm lint

      - name: Strict TypeScript verification (src + tests)
        run: pnpm typecheck:all

  test-linux:
    name: Test (Ubuntu - Node ${{ matrix.node }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        shell: bash
        run: |
          pnpm test 2>&1 | tee test-output.log
          node scripts/check-test-badge.mjs test-output.log
        env:
          REDIS_HOST: '127.0.0.1'
          REDIS_PORT: 6379

      - name: Live-Redis integration tests (service container)
        shell: bash
        run: pnpm run test:integration
        env:
          REDIS_HOST: '127.0.0.1'
          REDIS_PORT: 6379

      - name: Build
        run: pnpm build

      - name: Package tarball dry-run verification
        run: pnpm pack --dry-run

  test-matrix:
    name: Test (${{ matrix.os }} - Node ${{ matrix.node }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        shell: bash
        run: |
          pnpm test 2>&1 | tee test-output.log
          node scripts/check-test-badge.mjs test-output.log

      - name: Build
        run: pnpm build

      - name: Package tarball dry-run verification
        run: pnpm pack --dry-run

  publish:
    name: Publish to npm & GitHub Release
    needs: [test-linux, test-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript verification
        run: pnpm typecheck:all

      - name: Build
        run: pnpm build

      - name: Publish with npm provenance
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
